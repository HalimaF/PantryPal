# With a name typed, signing up still needs an email and password.
appId: com.haleema.what_can_i_cook
---
- launchApp:
    clearState: true
- tapOn: "Create an account"
- tapOn: "For example: Ayesha"
- inputText: "Halima"
- hideKeyboard
- tapOn: "Create my account"
- assertVisible: "Please enter your email and password."
# switching back to log in clears the message and removes the name box
- tapOn: "I already have an account"
- assertNotVisible: "Please enter your email and password."
- assertNotVisible: "Your name"
